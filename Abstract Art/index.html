<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Art</title>
    <style>
        *{
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<body>
    <div style="display:inline-block; width: 310px; height: 72px; background-color: brown; border-radius: 12px;"></div>

    <div style="display: inline-block; width: 200px; height: 100px; background-color: burlywood; border-style: dotted; border-width: 10px; border-color: chocolate; outline-style: solid; outline-width: 20px; border-radius: 40px; float: right;"></div>

    <div style="display: inline-block; width: 100px; height: 100px; background-color:cadetblue; border-radius: 50px;"></div>

    <div style="display: inline-block; width: 200px; height: 300px; background-color: mediumseagreen; border-style:dashed; border-width: 10px; border-color:darkmagenta; outline-style: solid; outline-width: 20px; border-radius: 40px; float: left;"></div>

</body>
</body>
</html>
